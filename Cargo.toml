[workspace]
resolver = "2"
members = [
  "crates/sprawler-domain", "crates/sprawler-protocol", "crates/sprawler",
  "plugins/analyzer-roc", "plugins/analyzer-rust",
  "plugins/analyzer-kit", "plugins/analyzer-typescript", "plugins/analyzer-python", "plugins/analyzer-go",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/clankernative/sprawler"
homepage = "https://github.com/clankernative/sprawler"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
